name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install xcaddy
        run: go install github.com/caddyserver/xcaddy/cmd/xcaddy@latest
      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 ./xcaddy.sh dist/caddy_linux_amd64
      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 ./xcaddy.sh dist/caddy_darwin_arm64
      - name: Verify modules
        run: |
          mods=$(dist/caddy_linux_amd64 list-modules)
          for m in http.handlers.rate_limit http.handlers.cache storages.cache.otter storages.cache.simplefs; do
            echo "$mods" | grep -qx "$m" || { echo "missing module $m"; exit 1; }
          done
          dist/caddy_linux_amd64 version
      - name: Validate default Caddyfile
        run: PORT=8080 dist/caddy_linux_amd64 validate --config Caddyfile.template --adapter caddyfile
      - name: Checksums
        run: cd dist && sha256sum caddy_linux_amd64 caddy_darwin_arm64 > SHA256SUMS && cat SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/caddy_linux_amd64 dist/caddy_darwin_arm64 dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes "Caddy v2.11.4 + caddy-ratelimit + cache-handler v0.17.0 + otter and simplefs storages"
